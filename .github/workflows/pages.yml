name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site_src/**"
      - "docs/**"
      - "BRIEF.md"
      - "mkdocs.yml"
      - "tools/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocs-awesome-pages-plugin

      # Assemble public-only site sources from the canonical docs. This is the
      # visibility gate — internal entries never reach the build.
      - name: Build site sources
        run: python tools/build_site.py

      - name: Build site
        run: mkdocs build --strict

      - name: Check internal links
        run: python tools/check_links.py site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
