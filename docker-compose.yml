# gyrus — Pip's memory. Allocation in LAB.md; platform contract in
# /data/code/dmz/ONBOARDING.md. Secrets in /data/docker/gyrus/.env (600).
# The dmz13 leg is REQUIRED for isolation, not just reachability — a plain
# bridge inherits the host's routing (ONBOARDING trap, measured 2026-07-28).

networks:
  gyrus_net:
    driver: bridge
  dmz13:
    external: true

services:
  app:
    build: .
    image: gyrus:latest
    container_name: gyrus
    restart: unless-stopped
    env_file: /data/docker/gyrus/.env
    volumes:
      # The dream pass writes its report here (consolidate.py creates the
      # directory on demand, so without this bind it succeeds into
      # container-local disk and the evidence dies on the next `up --build`).
      # Two reports from the first full-corpus committed consolidation were
      # lost exactly that way on 2026-08-15. The dream pass IS the thesis
      # (ADR-0002); its output is the record that it ran and what it decided.
      # Bind the DIRECTORY, never a file — single-file binds pin the inode and
      # edits silently never land (platform gotcha).
      - /data/docker/gyrus/dream-reports:/data/dream-reports
    networks:
      gyrus_net: {}
      dmz13:
        ipv4_address: 10.0.13.11
